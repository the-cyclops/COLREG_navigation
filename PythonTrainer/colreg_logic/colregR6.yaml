timestep: 0.05 
dense: True
#horizon: 80 # 1 / (Unity_100Hz / Decision_Period_5) * 80 steps = 4.0s
constants:
  - name: safe_speed_limit
    type: float
    value: 2.1 # Maximum safe speed (m/s) reasonable for our boats
variables:
  - name: boat_speed
    type: float
    location: obs
    identifier: id_boat_speed
  - name: r1_signal
    type: float
    location: obs
    identifier: id_r1_signal
  - name: keep_signal
    type: float
    location: obs
    identifier: id_keep_signal
  - name: no_turning_signal # (Signal >= 0 if ego keeps its course)
    type: float
    location: obs
    identifier: id_no_turning_signal 
specifications:
  - name: R1_safe_distance # R1: Maintain a safety margin (Signal >= 0 means no collision risk in a t_horizon)
    spec: R1_safe_distance = always[0, 80](r1_signal >= 0.0)
    weight: 1.0

  - name: R2_safe_speed # R2: Maintain a safe speed within the time horizon
    spec: R2_safe_speed = always[0, 80]((boat_speed <= safe_speed_limit) and (boat_speed >= -1.0))
    weight: 1.0

  - name: R6_stand_on # R6: Stand-on vessel must keep its course until the situation is resolved
    spec: R6_stand_on = always[0, 80]((keep_signal <= 0.0) or ((no_turning_signal >= 0.0) until (keep_signal <= 0.0)))
    weight: 1.0